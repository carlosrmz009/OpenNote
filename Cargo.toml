[workspace]
resolver = "2"
members = [
    "crates/on-score",
    "crates/on-hand",
    "crates/on-fingering",
    "crates/on-audio",
    "crates/on-train",
    "crates/on-engrave",
    "crates/on-viz",
    "crates/on-cli",
]

[workspace.package]
# Changing this version and pushing to main makes a release; see docs/RELEASING.md.
version = "1.0.2"
edition = "2021"
rust-version = "1.85"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/carlosrmz009/OpenNote"

[workspace.dependencies]
on-score = { path = "crates/on-score" }
on-hand = { path = "crates/on-hand" }
on-fingering = { path = "crates/on-fingering" }
on-audio = { path = "crates/on-audio", default-features = false }
on-train = { path = "crates/on-train" }
on-engrave = { path = "crates/on-engrave" }
on-viz = { path = "crates/on-viz", default-features = false }

anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glam = "0.32"
midly = "0.5"
musicxml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

# Lints CI holds the workspace to. The numeric code indexes in loops over joints, fingers
# and keys, and its solvers pass their state as arguments; those lints are relaxed.
[workspace.lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

[package]
name = "on-viz"
version.workspace = true
edition.workspace = true
# Bevy 0.19 and egui need 1.95; the engine crates keep the workspace minimum.
rust-version = "1.95"
license.workspace = true
description = "Overhead orthographic visualizer: flat Synthesia keyboard and falling notes with 3D articulated hands."

[dependencies]
bevy = { version = "0.19", optional = true }
on-hand.workspace = true
on-score.workspace = true
on-fingering.workspace = true
on-audio = { workspace = true, default-features = false }
anyhow.workspace = true
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
glam.workspace = true
tracing.workspace = true
bevy_egui = { version = "0.42", optional = true }
rfd = { version = "0.17", optional = true }

[features]
default = ["render"]
render = ["dep:bevy", "dep:bevy_egui", "dep:rfd", "dep:image", "on-audio/playback"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package]
name = "on-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `opennote` command line application."

[[bin]]
name = "opennote"
path = "src/main.rs"

[dependencies]
# A faster allocator. This workload allocates hard on every core at once, which is
# what the system allocator on Windows is worst at.
mimalloc = "0.1"
on-hand.workspace = true
on-score.workspace = true
on-fingering.workspace = true
on-train.workspace = true
on-engrave.workspace = true
on-viz = { workspace = true, features = ["render"] }
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }
tracing.workspace = true
tracing-subscriber.workspace = true

name: Release

# Builds the installers for Windows, macOS and Linux and publishes them.
#   - Change `version` in Cargo.toml and push it to main: this makes the tag and the release
#     for that version by itself.
#   - Or create a release by hand with a tag like v1.2.3 (the tag must match Cargo.toml).
#   - Or run it by hand from the Actions tab to build without publishing; the installers are
#     then attached to the run.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  # Decides what to do: a new version on main (or a tag) builds and publishes; anything
  # else that touches Cargo.toml does nothing; a manual run builds without publishing.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        run: |
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -1)
          [[ -n "$cargo_version" ]] || { echo "::error::no version in Cargo.toml"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$cargo_version" ]]; then
              echo "::error::the tag says $version but Cargo.toml says $cargo_version; the app would think it is out of date"
              exit 1
            fi
            build=true; release=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="$cargo_version"
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null 2>&1; then
              echo "v$version is already released, nothing to do."
              build=false; release=false
            else
              build=true; release=true
            fi
          else
            version=dev; build=true; release=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS (Apple silicon)
            os: macos-15
            arch: arm64
          - name: macOS (Intel)
            os: macos-15-intel
            arch: intel
          - name: Linux
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev cmake

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the compiled Verovio library
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/src/target/verovio-cache
          key: verovio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      # The trained model is not in the repository. Without it the installers still work,
      # and finger with the rules and the hand model alone. To include it, store it as the
      # secret OPENNOTE_MODEL (the JSON itself, if it is under the 48 KB a secret can hold),
      # or put it somewhere private and set OPENNOTE_MODEL_URL (and OPENNOTE_MODEL_TOKEN, if
      # the place needs one).
      - name: Trained model
        shell: bash
        env:
          MODEL: ${{ secrets.OPENNOTE_MODEL }}
          MODEL_URL: ${{ secrets.OPENNOTE_MODEL_URL }}
          MODEL_TOKEN: ${{ secrets.OPENNOTE_MODEL_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/model"
          target="$RUNNER_TEMP/model/helios-beta1.8.json"
          if [[ -n "$MODEL" ]]; then
            printf '%s' "$MODEL" > "$target"
          elif [[ -n "$MODEL_URL" ]]; then
            auth=()
            [[ -n "$MODEL_TOKEN" ]] && auth=(-H "Authorization: Bearer $MODEL_TOKEN")
            curl -fsSL "${auth[@]}" -H "Accept: application/octet-stream" -o "$target" "$MODEL_URL"
          fi
          if [[ -s "$target" ]]; then
            echo "OPENNOTE_MODEL=$target" >> "$GITHUB_ENV"
          else
            echo "::warning::No trained model was provided, so these installers use the rules only."
          fi

      - name: Build
        shell: bash
        env:
          OPENNOTE_RELEASE_KEY: ${{ secrets.OPENNOTE_RELEASE_KEY }}
        run: cargo build --release --locked -p on-cli

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "dist/opennote"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item target/release/opennote.exe $dist
          Copy-Item -Recurse assets "$dist/assets"
          Copy-Item LICENSE, LICENSES.md, NOTICE.md, packaging/icon.ico $dist
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source ?? "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ needs.plan.outputs.version }}" "/DSourceDir=$PWD\$dist" "/DOutputDir=$PWD\out" packaging/windows/opennote.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: packaging/macos/build-app.sh "${{ needs.plan.outputs.version }}" "${{ matrix.arch }}"

      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux/build-appimage.sh "${{ needs.plan.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}-${{ matrix.arch || 'x64' }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Checksums
        run: cd installers && sha256sum * > SHA256SUMS.txt
      # Makes the tag too, if it does not exist yet, pointing at the commit that was built.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: OpenNote ${{ needs.plan.outputs.version }}
          files: installers/*
          generate_release_notes: true
          make_latest: true
